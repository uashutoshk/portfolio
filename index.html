  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#eff1f5" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <script>
    // set theme before first paint — no flash of the wrong flavor
    (function () {
      try {
        var stored = localStorage.getItem('theme');
        var theme = stored === 'latte' || stored === 'mocha'
          ? stored
          : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'latte' : 'mocha');
        document.documentElement.dataset.theme = theme;
      } catch (e) { /* private mode — keep mocha default */ }
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
